<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>줄넘기 인식 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2b2020;
    --cream: #fff8e7;
    --red: #ff4d5a;
    --blue: #3d8bff;
    --yellow: #ffd23f;
    --panel: #fffdf6;
    --muted: #8a7f73;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #1d1a24; color: var(--ink);
    font-family: 'Jua', system-ui, sans-serif;
    display: grid; grid-template-rows: auto minmax(130px, 34%) 1fr;
    height: 100dvh; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  body.nograph { grid-template-rows: auto auto 1fr; }
  body.nograph .graph { display: none; }
  body.nograph .panel { grid-template-columns: 1fr; }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 6px 10px; background: var(--yellow); border-bottom: 3px solid var(--ink);
  }
  header h1 { font-size: 18px; margin: 0 6px 0 0; font-weight: 400; }
  button, select {
    font-family: inherit; font-size: 14px; color: var(--ink);
    background: var(--cream); border: 2px solid var(--ink); border-radius: 8px;
    padding: 4px 8px; box-shadow: 0 3px 0 var(--ink); cursor: pointer;
  }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  button.primary { background: #6cc24a; color: #fff; text-shadow: 0 1px 0 var(--ink); }
  label.chk { display: flex; align-items: center; gap: 3px; font-size: 14px; }
  #status { margin-left: auto; font-size: 13px; background: var(--ink); color: var(--yellow); padding: 3px 10px; border-radius: 99px; }

  #panels { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; min-height: 0; }
  .panel {
    background: var(--panel); border: 3px solid var(--ink); border-radius: 12px;
    display: grid; grid-template-columns: minmax(160px, 36%) 1fr; gap: 6px; padding: 6px; min-height: 0;
    position: relative; overflow: hidden;
  }
  .panel.red { border-color: var(--red); box-shadow: inset 0 0 0 2px var(--red); }
  .panel.blue { border-color: var(--blue); box-shadow: inset 0 0 0 2px var(--blue); }
  .info { display: flex; flex-direction: column; gap: 2px; min-height: 0; }
  .tagrow { display: flex; align-items: center; gap: 6px; }
  .tag { color: #fff; padding: 1px 10px; border-radius: 99px; font-size: 14px; }
  .red .tag { background: var(--red); } .blue .tag { background: var(--blue); }
  .seen { font-size: 12px; color: var(--muted); }
  .seen.on { color: #2f9e44; }
  .mode { font-size: 12px; padding: 0 8px; border-radius: 99px; background: #eee3cc; }
  .mode.alt { background: #e3d4ff; }
  .mode.walk { background: #ffd8a8; }
  .count { font-size: 44px; line-height: 1; }
  .count small { font-size: 16px; color: var(--muted); }
  .stat { font-size: 13px; color: var(--muted); }
  .stat b { color: var(--ink); font-weight: 400; font-size: 15px; }
  .ctrl { display: flex; align-items: center; gap: 4px; font-size: 12px; margin-top: auto; flex-wrap: wrap; }
  .ctrl select, .ctrl button { font-size: 12px; padding: 2px 6px; box-shadow: 0 2px 0 var(--ink); }
  .ctrl input[type=range] { width: 70px; }
  .graph { width: 100%; height: 100%; min-height: 0; background: #fbf6e9; border-radius: 8px; border: 2px solid #e6dcc6; }

  #stage { position: relative; min-height: 0; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #msg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; text-align: center; color: #fff; font-size: 22px; padding: 20px;
    pointer-events: none;
  }
  #msg .big { font-size: 120px; color: var(--yellow); text-shadow: 0 6px 0 var(--ink); line-height: 1; }
  #msg .small { font-size: 15px; color: #ddd; max-width: 560px; line-height: 1.5; }
  #result {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(20, 16, 28, .7);
  }
  #result .card {
    background: var(--cream); border: 4px solid var(--ink); border-radius: 16px; padding: 18px 26px;
    text-align: center; box-shadow: 0 8px 0 var(--ink); min-width: 300px;
  }
  #result h2 { margin: 0 0 10px; font-weight: 400; }
  #result .row { display: flex; gap: 20px; justify-content: center; margin-bottom: 12px; }
  #result .col { padding: 8px 16px; border-radius: 12px; color: #fff; }
  #result .col.r { background: var(--red); } #result .col.b { background: var(--blue); }
  #result .col .n { font-size: 44px; }
  #result p { font-size: 14px; color: var(--muted); margin: 0 0 10px; }
  video { display: none; }
</style>
</head>
<body>
<header>
  <h1>🔧 인식 테스트</h1>
  <button id="btnStart" class="primary">📷 카메라 시작</button>
  <select id="selCam" title="카메라"><option value="">카메라 선택</option></select>
  <select id="selRes" title="해상도">
    <option value="640x480" selected>640×480</option>
    <option value="480x360">480×360 (가벼움)</option>
    <option value="1280x720">1280×720</option>
  </select>
  <select id="selEngine" title="인식 엔진">
    <option value="mp2" selected>엔진A: MediaPipe 2명</option>
    <option value="mpsplit">엔진B: MediaPipe 분할</option>
    <option value="movenet">엔진C: MoveNet</option>
  </select>
  <select id="selModel" title="인식 모델 (엔진 A·B)">
    <option value="lite" selected>모델: 가벼움</option>
    <option value="full">모델: 정확함</option>
  </select>
  <label class="chk"><input type="checkbox" id="chkMirror" checked>거울</label>
  <label class="chk"><input type="checkbox" id="chkGraph" checked>그래프</label>
  <label class="chk" title="걸어 다니거나 제자리걸음일 때는 세지 않아요"><input type="checkbox" id="chkWalk" checked>걷기 거르기</label>
  <button id="btnTest">⏱ 30초 측정</button>
  <button id="btnFull">⛶</button>
  <span id="status">대기 중</span>
</header>

<section id="panels"></section>

<section id="stage">
  <canvas id="view"></canvas>
  <div id="msg">
    <div>📷 <b>카메라 시작</b>을 눌러주세요</div>
    <div class="small">태블릿을 가로로 세우고 2.5~3m 떨어져서, 빨간 박스와 파란 박스에 한 명씩 서 주세요.<br>머리부터 발끝까지 화면에 다 나와야 정확해요.</div>
  </div>
  <div id="result"><div class="card">
    <h2>⏱ 30초 측정 결과</h2>
    <div class="row">
      <div class="col r"><div>빨강</div><div class="n" id="resR">0</div><div id="resR2"></div></div>
      <div class="col b"><div>파랑</div><div class="n" id="resB">0</div><div id="resB2"></div></div>
    </div>
    <p id="resInfo"></p>
    <p>직접 센 횟수와 비교해 보세요.<br>너무 적게 세면 감도를 올리고, 너무 많이 세면 내리세요.</p>
    <button id="btnClose">닫기</button>
  </div></div>
</section>

<video id="video" playsinline muted></video>

<script type="module">
import { PoseLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

const WASM = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const MODELS = {
  lite: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
  full: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task',
};
const TF_SCRIPTS = [
  'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js',
  'https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js',
];
const ENGINE_NAMES = { mp2: 'A', mpsplit: 'B', movenet: 'C' };
const GRADE_SENS = { '12': 8, '34': 6, '56': 5 };
// 몸 전체 오르내림(모아뛰기)에 쓰는 부위
const POINTS = [
  { key: 'nose', idx: [0], w: 1 },
  { key: 'sh', idx: [11, 12], w: 1.5 },
  { key: 'hip', idx: [23, 24], w: 2 },
  { key: 'ank', idx: [27, 28], w: 1 },
];
// 걷기 거르기
const UPPER = new Set(['nose', 'sh', 'hip']); // 상체만 따로 본 오르내림 (발 들기와 무관)
const UB_K = 0.5;          // 상체가 감도 기준의 50% 이상 들썩여야 점프로 인정
const MOVE_WIN = 0.8;      // 이동 판단 구간(초)
const MOVE_DX = 0.25;      // 그 사이 엉덩이가 몸통 길이의 25% 넘게 옆으로 움직이면 이동
const MOVE_DS = 0.1;       // 몸 크기가 10% 넘게 변하면 앞뒤 이동
const MOVE_HOLD = 0.8;     // 멈춘 뒤 이만큼은 계속 이동 중으로 봄
// 세기 조건
const BODY_PTS = [0, 11, 12, 23, 24, 27, 28]; // 코·어깨·엉덩이·발목이 다 보여야 함
const BOX_X = [[0.03, 0.485], [0.515, 0.97]]; // 화면(거울 적용) 기준 빨강/파랑 박스 가로 범위
const BOX_TOL = 0.03;      // 박스 경계 여유
const WARMUP = 2;          // 전신이 박스 안에 들어온 뒤 이만큼(초)은 세지 않음
const LOST_GRACE = 0.5;    // 잠깐(0.5초 이하) 발이 안 잡혀도 계속 셈
const MIN_IV = { bob: 0.25, alt: 0.17 }; // 이보다 짧은 간격의 점프는 버림 (모아 240회/분, 번갈아 350회/분)
const MAX_RATE = 5;        // 속도 표시 상한 (초당 5회 = 300회/분)
const BONES = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];

const $ = s => document.querySelector(s);
const video = $('#video'), view = $('#view'), vctx = view.getContext('2d');
const statusEl = $('#status'), msgEl = $('#msg');

// ───────────────────────── 신호 채널 ─────────────────────────
// bob : 몸 전체 오르내림 → 착지할 때 1회 (모아뛰기)
// alt : 왼발-오른발 높이 차이 → 좌우가 바뀔 때마다 1회 (번갈아뛰기)
class Channel {
  constructor(kind) { this.kind = kind; this.twoSided = kind === 'alt'; this.reset(); }
  reset() { this.buf = []; this.base = null; this.sm = null; this.state = 0; this.upT = 0; this.amp = 0; this.active = false; this.ac = { rate: 0, conf: 0 }; this.lastEvt = -99; this.lastT = -99; }
  feed(t, v, dt, minAmp, detrend) {
    if (t - this.lastT > 0.5) { this.base = null; this.sm = null; this.state = 0; }
    this.lastT = t;
    let s = v;
    if (detrend) {
      if (this.base == null) this.base = v;
      this.base += (1 - Math.exp(-dt / 0.8)) * (v - this.base);
      s = v - this.base;
    }
    this.sm = this.sm == null ? s : this.sm + 0.75 * (s - this.sm);
    let mx = this.sm, mn = this.sm;
    for (let i = this.buf.length - 1; i >= 0 && this.buf[i].t > t - 1.5; i--) {
      if (this.buf[i].s > mx) mx = this.buf[i].s; if (this.buf[i].s < mn) mn = this.buf[i].s;
    }
    const amp = mx - mn, md = (mx + mn) / 2;
    const hi = md + amp * 0.2, lo = md - amp * 0.2;
    const active = amp >= minAmp;
    this.amp = amp; this.active = active;
    let evt = false;
    if (!this.twoSided) {
      if (this.state !== 1) { if (active && this.sm > hi) { this.state = 1; this.upT = t; } }
      else if (this.sm < lo) { this.state = -1; evt = active; }
      else if (t - this.upT > 1.2) this.state = -1;
    } else if (active) {
      if (this.sm > hi && this.state !== 1) { evt = this.state === -1; this.state = 1; }
      else if (this.sm < lo && this.state !== -1) { evt = this.state === 1; this.state = -1; }
    }
    if (evt) { if (t - this.lastEvt < 0.12) evt = false; else this.lastEvt = t; }
    this.buf.push({ t, s: this.sm, hi, lo, active });
    while (this.buf.length && this.buf[0].t < t - 5) this.buf.shift();
    this.ac = autocorrRate(this.buf, t);
    return evt;
  }
  stepRate() { return this.ac.rate * (this.twoSided ? 2 : 1); }
}

// ───────────────────────── 플레이어 ─────────────────────────
class Player {
  constructor(id, name, color) {
    this.id = id; this.name = name; this.color = color; this.sens = 6;
    this.motion = []; this.bob = new Channel('bob'); this.alt = new Channel('alt'); this.ub = new Channel('bob');
    this.reset();
  }
  reset() {
    this.bob.reset(); this.alt.reset(); this.ub.reset();
    this.trk = []; this.moveUntil = -99; this.moving = false; this.walkBlock = false;
    this.count = 0; this.jumpTimes = []; this.events = []; this.lastJumpT = -99; this.lastRawT = -99; this.primary = 'bob';
    this.bases = {}; this.scale = null; this.lastT = null;
    this.present = false; this.lastSeen = -99; this.lms = null;
    this.okSince = null; this.badSince = null; this.state = 'none';
    this.rate = 0; this.peak = 0; this.flash = 0;
  }
  resetCount() { this.count = 0; this.jumpTimes = []; this.events = []; this.peak = 0; this.lastJumpT = -99; }
  clearTracking() { this.bases = {}; this.scale = null; this.lastT = null; this.lms = null; this.bob.reset(); this.alt.reset(); this.ub.reset(); this.trk = []; this.moveUntil = -99; this.moving = false; this.walkBlock = false; this.okSince = null; this.badSince = null; this.state = 'none'; }
  get minAmp() { return 0.0872 - this.sens * 0.0072; } // 몸통 길이 대비 (감도 1=0.08, 6=0.044, 10=0.015)
  get minAmpAlt() { return this.minAmp * 1.6; }

  miss(t) {
    if (this.present && t - this.lastSeen > 0.5) { this.present = false; this.clearTracking(); }
    if (!this.present) this.state = 'none';
    this.updateRate(t);
  }

  feed(t, lms, vw, vh) {
    this.present = true; this.lastSeen = t; this.lms = lms;
    const ok = p => p && p.y > -0.05 && p.y < 1.05 && (p.visibility === undefined || p.visibility === 0 || p.visibility > 0.35);

    // 0) 전신이 자기 박스 안에 보이는지 → 들어온 뒤 WARMUP초 지나야 셈
    const mirror = $('#chkMirror').checked, [bx0, bx1] = BOX_X[this.id];
    const inBox = l => { const x = mirror ? 1 - l.x : l.x; return x > bx0 - BOX_TOL && x < bx1 + BOX_TOL && l.y > -0.02 && l.y < 1.02; };
    const bodyOk = BODY_PTS.every(i => ok(lms[i]) && inBox(lms[i]));
    if (bodyOk) { this.badSince = null; if (this.okSince == null) this.okSince = t; }
    else { if (this.badSince == null) this.badSince = t; if (t - this.badSince > LOST_GRACE) this.okSince = null; }
    const ready = this.okSince != null && t - this.okSince >= WARMUP;
    this.state = this.okSince == null ? 'body' : ready ? 'ok' : 'warm';
    const sh = mid(lms[11], lms[12]), hp = mid(lms[23], lms[24]);
    const torso = Math.hypot((sh.x - hp.x) * vw, (sh.y - hp.y) * vh);
    if (torso < 8) return;
    this.scale = this.scale == null ? torso : this.scale * 0.92 + torso * 0.08;
    const dt = this.lastT == null ? 0.033 : Math.min(0.2, t - this.lastT);
    this.lastT = t;
    const a = 1 - Math.exp(-dt / 0.8);

    // 1) 몸 전체 오르내림 (부위별 기준선을 따로 두어 부위가 잠깐 사라져도 튀지 않게)
    let sum = 0, wsum = 0, usum = 0, uw = 0;
    for (const pt of POINTS) {
      const ps = pt.idx.map(i => lms[i]);
      if (!ps.every(ok)) continue;
      const y = ps.reduce((s, p) => s + p.y, 0) / ps.length * vh;
      let b = this.bases[pt.key];
      if (!b || t - b.t > 0.4) { this.bases[pt.key] = { v: y, t }; continue; }
      b.v += a * (y - b.v); b.t = t;
      const v = -(y - b.v) / this.scale;
      sum += pt.w * v; wsum += pt.w;
      if (UPPER.has(pt.key)) { usum += pt.w * v; uw += pt.w; }
    }
    const evB = wsum ? this.bob.feed(t, sum / wsum, dt, this.minAmp, false) : false;
    if (uw) this.ub.feed(t, usum / uw, dt, this.minAmp, false);

    // 1-2) 걸어서 이동 중인지 (엉덩이 좌우 이동, 몸 크기 변화 = 앞뒤 이동)
    this.trk.push({ t, x: (lms[23].x + lms[24].x) / 2 * vw, s: torso });
    while (this.trk.length && this.trk[0].t < t - MOVE_WIN - 0.3) this.trk.shift();
    const avg = arr => ({ x: arr.reduce((a, c) => a + c.x, 0) / arr.length, s: arr.reduce((a, c) => a + c.s, 0) / arr.length });
    const now = this.trk.filter(e => e.t > t - 0.15), old = this.trk.filter(e => e.t <= t - MOVE_WIN && e.t > t - MOVE_WIN - 0.15);
    if (now.length && old.length) {
      const A = avg(now), B = avg(old);
      if (Math.abs(A.x - B.x) / this.scale > MOVE_DX || Math.abs(Math.log(A.s / B.s)) > MOVE_DS) this.moveUntil = t + MOVE_HOLD;
    }
    this.moving = t < this.moveUntil;

    // 2) 왼발-오른발 높이 차이 (발목 + 무릎)
    let evA = false;
    if ([25, 26, 27, 28].every(i => ok(lms[i]))) {
      const d = ((lms[27].y - lms[28].y) + (lms[25].y - lms[26].y)) / 2 * vh / this.scale;
      evA = this.alt.feed(t, d, dt, this.minAmpAlt, true);
    }

    // 3) 더 뚜렷한 쪽을 주 신호로 (자주 바뀌지 않게 1.3배 차이 필요)
    const sb = this.bob.active ? this.bob.amp / this.minAmp : 0;
    const sa = this.alt.active && t - this.alt.lastT < 0.3 ? this.alt.amp / this.minAmpAlt : 0;
    if (this.primary === 'bob' && sa >= 1 && sa > sb * 1.3) this.primary = 'alt';
    else if (this.primary === 'alt' && (sb >= 1 && sb > sa * 1.3 || sa === 0)) this.primary = 'bob';

    let evt = this.primary === 'bob' ? evB : evA;
    // 걷기 거르기: 걸어서 이동 중이거나, 발만 움직이고 상체가 들썩이지 않으면(제자리걸음) 세지 않음
    this.walkBlock = filterWalk && (this.moving || this.ub.amp < this.minAmp * UB_K);
    if (this.walkBlock) evt = false;
    if (this.state !== 'ok') evt = false;
    // 사람이 낼 수 없는 속도: 직전 신호(센 것이든 버린 것이든)와 간격이 너무 짧으면 버림
    //  → 계속 떨리는 잡음은 한 번도 세지 않고, 진짜 점프 사이에 낀 헛신호만 걸러짐
    if (evt) { const tooFast = t - this.lastRawT < MIN_IV[this.primary]; this.lastRawT = t; if (tooFast) evt = false; }
    if (evt) {
      this.count++; this.lastJumpT = t; this.flash = 1;
      this.jumpTimes.push(t); if (this.jumpTimes.length > 8) this.jumpTimes.shift();
      this.events.push(t); while (this.events.length && this.events[0] < t - 5) this.events.shift();
    }
    this.updateRate(t);
  }

  get channel() { return this.primary === 'alt' ? this.alt : this.bob; }

  updateRate(t) {
    const jt = this.jumpTimes, ivs = [];
    for (let i = 1; i < jt.length; i++) ivs.push(jt[i] - jt[i - 1]);
    const med = ivs.length ? ivs.slice().sort((a, b) => a - b)[ivs.length >> 1] : 0;
    const since = t - this.lastJumpT;
    this.rateIv = (med && since < Math.max(1.2, med * 2)) ? 1 / med : 0;
    const ch = this.channel;
    let target = 0;
    if (this.present && this.state === 'ok' && since < 1.5 && ch.active) target = (ch.ac.conf > 0.35 && ch.ac.rate > 0) ? ch.stepRate() : this.rateIv;
    target = Math.min(target, MAX_RATE);
    this.rate += (target - this.rate) * (target > this.rate ? 0.2 : 0.06);
    if (this.rate < 0.05) this.rate = 0;
    this.peak = Math.max(this.peak, this.rate * 60);
  }
}

function mid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }

function autocorrRate(buf, t) {
  const fs = 30, T = 2.5, t0 = t - T;
  let k = 0; while (k < buf.length && buf[k].t < t0) k++;
  const pts = buf.slice(Math.max(0, k - 1));
  if (pts.length < 15 || pts[0].t > t0 + 0.3) return { rate: 0, conf: 0 };
  const n = Math.floor(T * fs), x = new Float32Array(n);
  let j = 0, mean = 0;
  for (let i = 0; i < n; i++) {
    const ti = t0 + i / fs;
    while (j < pts.length - 2 && pts[j + 1].t < ti) j++;
    const p = pts[j], q = pts[j + 1];
    const u = Math.min(1, Math.max(0, (ti - p.t) / ((q.t - p.t) || 1)));
    x[i] = p.s + (q.s - p.s) * u; mean += x[i];
  }
  mean /= n; for (let i = 0; i < n; i++) x[i] -= mean;
  const minL = 4, maxL = 40, r = new Float32Array(maxL + 2);
  let best = 0;
  for (let L = minL; L <= maxL + 1; L++) {
    let s = 0, a = 0, b = 0;
    for (let i = 0; i + L < n; i++) { s += x[i] * x[i + L]; a += x[i] * x[i]; b += x[i + L] * x[i + L]; }
    r[L] = (a && b) ? s / Math.sqrt(a * b) : 0;
    if (L <= maxL) best = Math.max(best, r[L]);
  }
  if (best < 0.3) return { rate: 0, conf: best };
  for (let L = minL + 1; L <= maxL; L++) {
    if (r[L] >= r[L - 1] && r[L] >= r[L + 1] && r[L] >= best * 0.8) {
      const d = r[L - 1] - 2 * r[L] + r[L + 1];
      const off = d ? 0.5 * (r[L - 1] - r[L + 1]) / d : 0;
      return { rate: fs / (L + off), conf: r[L] };
    }
  }
  return { rate: 0, conf: best };
}

async function makeMP(model, numPoses) {
  const vision = await FilesetResolver.forVisionTasks(WASM);
  const opts = delegate => ({
    baseOptions: { modelAssetPath: MODELS[model], delegate },
    runningMode: 'VIDEO', numPoses,
    minPoseDetectionConfidence: 0.5, minPosePresenceConfidence: 0.5, minTrackingConfidence: 0.5,
  });
  try { return { lm: await PoseLandmarker.createFromOptions(vision, opts('GPU')), delegate: 'GPU' }; }
  catch (e) { console.warn('GPU 실패, CPU 사용', e); return { lm: await PoseLandmarker.createFromOptions(vision, opts('CPU')), delegate: 'CPU' }; }
}

function loadScript(src) {
  return new Promise((res, rej) => {
    if ([...document.scripts].some(s => s.src === src)) return res();
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error(src)); document.head.appendChild(s);

// MoveNet 17점 → MediaPipe 33점 번호로 변환
const MN_MAP = { 0: 0, 5: 11, 6: 12, 7: 13, 8: 14, 9: 15, 10: 16, 11: 23, 12: 24, 13: 25, 14: 26, 15: 27, 16: 28 };
function fromMoveNet(kps, vw, vh) {
  const out = Array.from({ length: 33 }, () => ({ x: 0, y: 2, visibility: 0.01 }));
  kps.forEach((k, i) => { if (MN_MAP[i] !== undefined) out[MN_MAP[i]] = { x: k.x / vw, y: k.y / vh, visibility: Math.max(0.01, k.score ?? 0) }; });
  return out;
}

const ENGINES = {
  async mp2(model) {
    const { lm, delegate } = await makeMP(model, 2);
    return {
      delegate,
      detect(now) { return (lm.detectForVideo(video, now).landmarks || []).map(l => ({ lms: l })); },
      close() { lm.close(); },
    };
  },
  async mpsplit(model) {
    const a = await makeMP(model, 1), b = await makeMP(model, 1);
    const lms = [a.lm, b.lm];
    const cvs = [0, 1].map(() => document.createElement('canvas'));
    return {
      delegate: a.delegate,
      detect(now) {
        const vw = video.videoWidth, vh = video.videoHeight, hw = Math.floor(vw / 2), mirror = $('#chkMirror').checked;
        const out = [];
        for (let i = 0; i < 2; i++) {
          const half = mirror ? 1 - i : i, cv = cvs[i];
          if (cv.width !== hw || cv.height !== vh) { cv.width = hw; cv.height = vh; }
          cv.getContext('2d').drawImage(video, half * hw, 0, hw, vh, 0, 0, hw, vh);
          const r = lms[i].detectForVideo(cv, now);
          if (r.landmarks && r.landmarks[0]) {
            out.push({ side: i, lms: r.landmarks[0].map(l => ({ x: (l.x * hw + half * hw) / vw, y: l.y, visibility: l.visibility })) });
          }
        }
        return out;
      },
      close() { lms.forEach(l => l.close()); },
    };
  },
  async movenet() {
    for (const s of TF_SCRIPTS) await loadScript(s);
    await tf.setBackend('webgl'); await tf.ready();
    const det = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, {
      modelType: poseDetection.movenet.modelType.MULTIPOSE_LIGHTNING,
      enableSmoothing: false, enableTracking: false, minPoseScore: 0.2, multiPoseMaxDimension: 256,
    });
    return {
      delegate: tf.getBackend().toUpperCase(),
      async detect() {
        const vw = video.videoWidth, vh = video.videoHeight;
        const poses = await det.estimatePoses(video, { maxPoses: 4 });
        return poses.map(p => ({ lms: fromMoveNet(p.keypoints, vw, vh) }));
      },
      close() { det.dispose(); },
    };
  },
};

async function loadEngine() {
  const kind = $('#selEngine').value, model = $('#selModel').value;
  if (loading) return;
  loading = true; statusEl.textContent = `엔진${ENGINE_NAMES[kind]} 불러오는 중…`;
  const old = engine; engine = null;
  while (busy) await new Promise(r => setTimeout(r, 20));
  try { old?.close(); } catch (e) {}
  try {
    engine = await ENGINES[kind](model); engineKind = kind;
    players.forEach(p => { p.present = false; p.clearTracking(); });
    statusEl.textContent = `엔진${ENGINE_NAMES[kind]} 준비 완료 (${engine.delegate})`;
  } catch (e) {
    console.error(e); statusEl.textContent = '엔진 불러오기 실패 (인터넷 확인)';
  }

}

async function startCamera(deviceId) {
  if (!window.isSecureContext) {
    showMsg('⚠️ 카메라를 쓸 수 없어요', 'https:// 주소이거나 PC에서 파일로 직접 열어야 카메라가 켜집니다.');
    return;
  }
  if (stream) stream.getTracks().forEach(t => t.stop());
  const [w, h] = $('#selRes').value.split('x').map(Number);
  const v = { width: { ideal: w }, height: { ideal: h }, frameRate: { ideal: 30 } };
  if (deviceId) v.deviceId = { exact: deviceId }; else v.facingMode = facing;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: v });
  } catch (e) {
    console.error(e); showMsg('⚠️ 카메라를 켤 수 없어요', '브라우저의 카메라 권한을 허용했는지 확인해 주세요. (' + e.name + ')');
    return;
  }
  video.srcObject = stream; await video.play();
  const track = stream.getVideoTracks()[0], st = track.getSettings();
  const isBack = st.facingMode === 'environment' || /back|rear|후면/i.test(track.label);
  $('#chkMirror').checked = !isBack;
  await fillCameras(st.deviceId);
  hideMsg(); running = true;
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {}
  if (!engine && !loading) loadEngine();
}

async function fillCameras(current) {
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  const sel = $('#selCam'); sel.innerHTML = '';
  devs.forEach((d, i) => {
    const o = document.createElement('option'); o.value = d.deviceId;
    o.textContent = d.label || ('카메라 ' + (i + 1)); if (d.deviceId === current) o.selected = true;
    sel.appendChild(o);
  });
}

let audioCtx = null;
const ac = () => (audioCtx ||= new (window.AudioContext || window.webkitAudioContext)());
function beep(f = 880, dur = 0.12) {
  const a = ac(), o = a.createOscillator(), g = a.createGain();
  o.frequency.value = f; g.gain.setValueAtTime(0.3, a.currentTime); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + dur);
}
function gunshot() {
  const a = ac(), len = Math.floor(a.sampleRate * 0.6), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 6);
  const src = a.createBufferSource(); src.buffer = buf;
  const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2500;
  const g = a.createGain(); g.gain.value = 1.4;
  src.connect(lp).connect(g).connect(a.destination); src.start();
}

// ───────────────────────── 그리기 ─────────────────────────
function fitCanvas(cv, maxDpr = 1) {
  const dpr = Math.min(window.devicePixelRatio || 1, maxDpr);
  const w = Math.round(cv.clientWidth * dpr), h = Math.round(cv.clientHeight * dpr);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return dpr;
}

function videoRect() {
  const W = view.width, H = view.height, vw = video.videoWidth || 4, vh = video.videoHeight || 3;
  const s = Math.min(W / vw, H / vh);
  return { x: (W - vw * s) / 2, y: (H - vh * s) / 2, w: vw * s, h: vh * s };
}
function boxRect(r, i) { return { x: r.x + r.w * (i ? 0.515 : 0.03), y: r.y + r.h * 0.04, w: r.w * 0.455, h: r.h * 0.92 }; }

function drawView() {
  const dpr = fitCanvas(view, 1);
  const W = view.width, H = view.height;
  vctx.fillStyle = '#1d1a24'; vctx.fillRect(0, 0, W, H);
  const r = videoRect(), mirror = $('#chkMirror').checked;
  if (video.readyState >= 2) {
    vctx.save();
    if (mirror) { vctx.translate(r.x + r.w, r.y); vctx.scale(-1, 1); vctx.drawImage(video, 0, 0, r.w, r.h); }
    else vctx.drawImage(video, r.x, r.y, r.w, r.h);
    vctx.restore();
  }
  players.forEach((p, i) => {
    const b = boxRect(r, i);
    p.flash *= 0.85;
    if (p.present) { vctx.fillStyle = p.color + '22'; vctx.fillRect(b.x, b.y, b.w, b.h); }
    vctx.lineWidth = (5 + p.flash * 10) * dpr; vctx.strokeStyle = p.color;
    vctx.strokeRect(b.x, b.y, b.w, b.h);
    vctx.font = `${16 * dpr}px Jua, sans-serif`;
    const label = p.name + (p.state === 'ok' ? (p.primary === 'alt' ? ' ✓ 번갈아' : ' ✓') : '');
    const lw = vctx.measureText(label).width + 20 * dpr;
    vctx.fillStyle = p.color; roundRect(vctx, b.x + 8 * dpr, b.y + 8 * dpr, lw, 26 * dpr, 13 * dpr); vctx.fill();
    vctx.fillStyle = '#fff'; vctx.textBaseline = 'middle'; vctx.fillText(label, b.x + 18 * dpr, b.y + 21 * dpr);
    vctx.font = `${Math.min(b.h * 0.22, 90 * dpr)}px Jua, sans-serif`; vctx.textAlign = 'right'; vctx.textBaseline = 'top';
    vctx.lineWidth = 6 * dpr; vctx.strokeStyle = '#2b2020'; vctx.strokeText(p.count, b.x + b.w - 12 * dpr, b.y + 10 * dpr);
    vctx.fillStyle = '#ffd23f'; vctx.fillText(p.count, b.x + b.w - 12 * dpr, b.y + 10 * dpr);
    vctx.textAlign = 'left';
    if (running && p.state !== 'ok') {
      const warm = p.state === 'warm';
      const txt = warm ? `준비… ${Math.max(1, Math.ceil(WARMUP - (performance.now() / 1000 - p.okSince)))}`
        : p.state === 'body' ? '머리부터 발끝까지\n박스 안에 서 주세요' : '박스 안에 서 주세요';
      const lines = txt.split('\n'), fs = Math.min(warm ? 40 : 18, b.w / dpr / 11) * dpr, lh = fs * 1.35;
      vctx.font = `${fs}px Jua, sans-serif`; vctx.textAlign = 'center'; vctx.textBaseline = 'middle';
      const tw = Math.max(...lines.map(l => vctx.measureText(l).width)), th = lh * lines.length;
      vctx.fillStyle = 'rgba(0,0,0,.45)'; roundRect(vctx, b.x + b.w / 2 - tw / 2 - 12 * dpr, b.y + b.h / 2 - th / 2 - 6 * dpr, tw + 24 * dpr, th + 12 * dpr, 12 * dpr); vctx.fill();
      vctx.fillStyle = warm ? '#ffd23f' : 'rgba(255,255,255,.95)';
      lines.forEach((l, k) => vctx.fillText(l, b.x + b.w / 2, b.y + b.h / 2 + (k - (lines.length - 1) / 2) * lh));
      vctx.textAlign = 'left';
    }
    if (p.present && p.lms) {
      const P = k => { const l = p.lms[k]; return [r.x + (mirror ? 1 - l.x : l.x) * r.w, r.y + l.y * r.h]; };
      vctx.strokeStyle = p.color; vctx.lineWidth = 4 * dpr; vctx.lineCap = 'round';
      vctx.beginPath();
      for (const [a, c] of BONES) { const A = P(a), C = P(c); vctx.moveTo(A[0], A[1]); vctx.lineTo(C[0], C[1]); }
      vctx.stroke();
      vctx.fillStyle = '#fff';
      for (const k of [0, 11, 12, 23, 24, 25, 26, 27, 28]) { const A = P(k); vctx.beginPath(); vctx.arc(A[0], A[1], 4 * dpr, 0, 7); vctx.fill(); }
    }
  });
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

function drawGraph(p, now) {
  const cv = p.el.graph, dpr = fitCanvas(cv, 1.5), ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height, T = 4, t0 = now - T;
  ctx.clearRect(0, 0, W, H);
  const X = t => (t - t0) / T * W;
  ctx.strokeStyle = '#e6dcc6'; ctx.lineWidth = 1 * dpr; ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();

    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(X(e), 8 * dpr, 4 * dpr, 0, 7); ctx.fill();
  });

    const pts = ch.buf.filter(b => b.t >= t0);
    if (!pts.length) return;
    let R = 0.1; pts.forEach(b => { R = Math.max(R, Math.abs(b.s) * 1.25); });
    const Y = v => H / 2 - v / R * H * 0.42;
    if (primary) {
      ctx.setLineDash([4 * dpr, 4 * dpr]); ctx.strokeStyle = 'rgba(43,32,32,.35)'; ctx.lineWidth = 1 * dpr;

  drawCh(p.bob, altPrimary ? 'rgba(0,0,0,.18)' : p.color, altPrimary ? 1.5 : 2.5, !altPrimary);
  drawCh(p.alt, altPrimary ? '#8b5cf6' : 'rgba(139,92,246,.35)', altPrimary ? 2.5 : 1.5, altPrimary);
  const ch = p.channel;
  ctx.fillStyle = '#8a7f73'; ctx.font = `${11 * dpr}px Jua, sans-serif`; ctx.textBaseline = 'top';
  ctx.fillText(`${altPrimary ? '보라=발 좌우 차이(주)' : '색=몸 오르내림(주)'} · 리듬 ${(ch.stepRate() * 60).toFixed(0)}/분 (신뢰 ${ch.ac.conf.toFixed(2)}) · 간격 ${(p.rateIv * 60 || 0).toFixed(0)}/분`, 6 * dpr, 4 * dpr);
}

function updatePanels() {
  players.forEach(p => {
    p.el.seen.textContent = { none: '● 인식 안 됨', body: '● 전신이 안 보여요', warm: '● 준비 중', ok: '● 인식 중' }[p.state];
    p.el.seen.classList.toggle('on', p.state === 'ok');
    const walking = p.state === 'ok' && p.walkBlock && (p.moving || p.alt.active || p.bob.active);
    p.el.mode.textContent = walking ? (p.moving ? '🚶 이동 중' : '🚶 걷기') : p.primary === 'alt' ? '번갈아뛰기' : '모아뛰기';
    p.el.mode.classList.toggle('alt', !walking && p.primary === 'alt');
    p.el.mode.classList.toggle('walk', walking);
    p.el.cnt.textContent = p.count;
    p.el.jpm.textContent = Math.round(p.rate * 60);
    p.el.pk.textContent = Math.round(p.peak);
    p.el.ampB.textContent = p.bob.amp.toFixed(2); p.el.minB.textContent = p.minAmp.toFixed(2);
    p.el.ampA.textContent = p.alt.amp.toFixed(2); p.el.minA.textContent = p.minAmpAlt.toFixed(2);
    p.el.ampU.textContent = p.ub.amp.toFixed(2); p.el.minU.textContent = (p.minAmp * UB_K).toFixed(2);
  });
}

// ───────────────────────── 메인 루프 ─────────────────────────
let fpsN = 0, fpsT = 0, uiT = 0;

function assign(poses, t) {
  const mirror = $('#chkMirror').checked;
  const vw = video.videoWidth, vh = video.videoHeight;
  const cand = [[], []];
  for (const p of poses) {
    const l = p.lms;
    const hx = (l[23].x + l[24].x) / 2, dx = mirror ? 1 - hx : hx;
    const side = p.side ?? (dx < 0.5 ? 0 : 1);
    cand[side].push({ lms: l, d: Math.abs(dx - (side ? 0.745 : 0.255)) });
  }
  players.forEach((p, i) => {
    if (cand[i].length) { cand[i].sort((a, b) => a.d - b.d); p.feed(t, cand[i][0].lms, vw, vh); }
    else p.miss(t);
  });
}

function loop() {
  requestAnimationFrame(loop);
  const nowMs = performance.now(), t = nowMs / 1000;
  if (running && engine && !busy && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime; busy = true;
    const eng = engine;
    Promise.resolve().then(() => eng.detect(nowMs)).then(poses => {
      if (eng !== engine) return;
      assign(poses, nowMs / 1000);
      inferMs = inferMs ? inferMs * 0.85 + (performance.now() - nowMs) * 0.15 : performance.now() - nowMs;
      fpsN++;
    }).catch(e => console.error(e)).finally(() => { busy = false; });
  }
  if (t - fpsT >= 1) {
    const fps = fpsN / (t - fpsT); fpsN = 0; fpsT = t;
    if (test && test.phase === 'run') testFps.push(fps);
    if (engine && running && !loading) statusEl.textContent = `엔진${ENGINE_NAMES[engineKind]} · ${engine.delegate} · 인식 ${inferMs.toFixed(0)}ms · ${fps.toFixed(0)} FPS`;
  }
  updateTest(t);
  drawView();
  if (t - uiT > 0.066) { // 화면 표시 갱신은 초당 15번이면 충분
    uiT = t;
    if ($('#chkGraph').checked) players.forEach(p => drawGraph(p, t));
    updatePanels();
  }
}

window.__debug = { Player, players, ENGINES }; // 개발자 점검용
requestAnimationFrame(loop);
</script>
